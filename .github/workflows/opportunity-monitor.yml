name: Opportunity monitoring

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofpath-opportunity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check opportunity pages and deadlines
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run scheduled monitoring when configured
        env:
          MONITORING_CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
          MONITOR_URL: ${{ vars.MONITOR_URL }}
        shell: bash
        run: |
          if [ -z "$MONITORING_CRON_SECRET" ] || [ "${#MONITORING_CRON_SECRET}" -lt 32 ] || [ -z "$MONITOR_URL" ]; then
            echo "::warning::Monitoring skipped. Configure MONITORING_CRON_SECRET and the repository variable MONITOR_URL for a dedicated monitoring-enabled service."
            exit 0
          fi

          case "$MONITOR_URL" in
            https://*) ;;
            *) echo "::error::MONITOR_URL must use HTTPS."; exit 1 ;;
          esac

          curl --silent --show-error --fail-with-body \
            --max-time 210 \
            --request POST "$MONITOR_URL/api/internal/monitoring/run" \
            --header "Authorization: Bearer $MONITORING_CRON_SECRET" \
            --header "Accept: application/json"
